name: Java CI with Maven - Test and package
on: 
   pull_request:
      branches:
        - main
jobs:
 build: 
  name: build
  runs-on: ubuntu-latest 
  steps:
   - name: move into current repository 
     uses: actions/checkout@v4

   - name: set-up java
     uses: actions/setup-java@v4
     with:
      distribution: 'corretto'
      java-version: '21'

   - name: build with maven
     run: mvn -B package 
    